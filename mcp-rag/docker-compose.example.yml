# Minimal Ollama + Qdrant for ops-mcp-rag (greenfield).
# Usage (from mcp-rag/):
#   docker compose -f docker-compose.example.yml up -d
#   docker exec -it ops-rag-ollama ollama pull nomic-embed-text
#
# Then point mcp-rag env / mcp.json at:
#   OLLAMA_URL=http://127.0.0.1:11434
#   QDRANT_URL=http://127.0.0.1:6333
#   EMBEDDING_MODEL=nomic-embed-text
#   EMBEDDING_DIM=768
#   QDRANT_COLLECTION=ops_knowledge
#
# Data lives in Docker volumes (not committed). Do not commit Qdrant storage.

name: ops-rag-backends

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ops-rag-ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ops-rag-qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      retries: 3
      timeout: 5s
    restart: unless-stopped

volumes:
  ollama_data:
  qdrant_data:
